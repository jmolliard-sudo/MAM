<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>PAUL · Les Crocs Mignons</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --green: #3B6D11; --green-bg: #EAF3DE; --green-mid: #639922;
  --orange: #854F0B; --orange-bg: #FAEEDA; --orange-mid: #BA7517;
  --red: #A32D2D; --red-bg: #FCEBEB; --red-mid: #E24B4A;
  --gray: #5F5E5A; --gray-bg: #F1EFE8; --gray-mid: #888780;
  --blue: #185FA5; --blue-bg: #E6F1FB; --blue-mid: #378ADD;
  --accent: #185FA5;
  --bg: #ffffff; --bg2: #f7f7f5; --bg3: #f0f0ee;
  --text: #1a1a1a; --text2: #777; --border: rgba(0,0,0,0.09);
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
  --radius: 14px; --radius-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141414; --bg2: #1f1f1f; --bg3: #2a2a2a;
    --text: #f0f0f0; --text2: #888; --border: rgba(255,255,255,0.1);
    --green-bg: #0f2008; --orange-bg: #291800; --red-bg: #280808;
    --gray-bg: #1e1e1c; --blue-bg: #071426;
    --green: #7ec84a; --orange: #e8a54b; --red: #f07070;
    --gray: #999; --blue: #5fa8e8;
  }
}
html { height: 100%; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font);
  max-width: 430px; margin: 0 auto; min-height: 100dvh;
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
}

/* NAV */
nav {
  display: flex; border-bottom: 0.5px solid var(--border);
  position: sticky; top: 0; background: var(--bg); z-index: 100;
  padding-top: env(safe-area-inset-top);
}
nav button {
  flex: 1; padding: 14px 0; font-size: 13px; font-family: var(--font);
  font-weight: 500; background: none; border: none; cursor: pointer;
  color: var(--text2); border-bottom: 2px solid transparent;
  transition: color .2s, border-color .2s;
}
nav button.active { color: var(--accent); border-bottom-color: var(--accent); }

/* SECTIONS */
.section { display: none; }
.section.active { display: block; }

/* ── HOME ── */
.home-header { padding: 24px 20px 16px; }
.home-header .sub { font-size: 13px; color: var(--text2); margin-bottom: 3px; }
.home-header .title { font-size: 24px; font-weight: 700; letter-spacing: -.4px; }
.home-header .dateline { font-size: 14px; color: var(--text2); margin-top: 5px; }

.card {
  margin: 0 16px; background: var(--bg2);
  border: 0.5px solid var(--border); border-radius: var(--radius); padding: 18px 20px;
}
.card + .card, .card + .main-btn, .main-btn + .card { margin-top: 12px; }

.today-row { display: flex; justify-content: space-between; align-items: flex-start; }
.lbl { font-size: 12px; color: var(--text2); margin-bottom: 4px; font-weight: 500; text-transform: uppercase; letter-spacing: .4px; }
.val { font-size: 26px; font-weight: 700; letter-spacing: -.5px; }
.val.muted { font-size: 18px; font-weight: 400; color: var(--text2); }
.divider { border: none; border-top: 0.5px solid var(--border); margin: 14px 0; }
.dur-row { display: flex; justify-content: space-between; align-items: center; }
.dur-row span:first-child { font-size: 13px; color: var(--text2); }
.dur-val { font-size: 20px; font-weight: 700; }

.main-btn {
  display: block; width: calc(100% - 32px); margin: 14px 16px;
  padding: 22px; border: none; border-radius: var(--radius);
  font-size: 19px; font-weight: 700; font-family: var(--font);
  cursor: pointer; transition: transform .1s, opacity .1s; letter-spacing: -.3px;
}
.main-btn:active { transform: scale(0.97); opacity: .88; }
.main-btn:disabled { cursor: default; }
.main-btn.arrive { background: var(--accent); color: #fff; }
.main-btn.depart { background: var(--green); color: #fff; }
.main-btn.done { background: var(--bg3); color: var(--text2); }

.week-title { font-size: 13px; color: var(--text2); margin-bottom: 12px; font-weight: 500; }
.week-days { display: flex; gap: 5px; }
.wd {
  flex: 1; text-align: center; padding: 8px 2px 7px;
  border-radius: 9px; border: 0.5px solid var(--border);
  background: var(--bg);
}
.wd.today-col { border-color: var(--accent); }
.wd-name { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: .4px; }
.wd-dot { width: 7px; height: 7px; border-radius: 50%; margin: 5px auto 4px; }
.wd-dur { font-size: 10px; font-weight: 600; }
.week-total-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
.week-total-row span:first-child { font-size: 13px; color: var(--text2); }
.week-total-val { font-size: 18px; font-weight: 700; }

.sync-bar { display: flex; align-items: center; gap: 7px; padding: 10px 20px 4px; font-size: 12px; color: var(--text2); }
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green-mid); flex-shrink: 0; }
.sync-dot.syncing { background: var(--orange-mid); animation: blink 1s infinite; }
.sync-dot.offline { background: var(--red-mid); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ── CALENDAR ── */
.cal-header { padding: 20px 20px 10px; display: flex; align-items: center; justify-content: space-between; }
.cal-month-title { font-size: 20px; font-weight: 700; }
.cal-nav { display: flex; gap: 8px; }
.cal-nav button {
  background: var(--bg2); border: 0.5px solid var(--border); border-radius: 9px;
  padding: 7px 13px; cursor: pointer; font-size: 16px; color: var(--text);
  font-family: var(--font); transition: background .15s;
}
.cal-nav button:active { background: var(--bg3); }

.cal-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 16px 14px; }
.cs { background: var(--bg2); border-radius: var(--radius-sm); padding: 12px 14px; }
.cs-lbl { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
.cs-val { font-size: 24px; font-weight: 700; letter-spacing: -.3px; }

.cal-dow {
  display: grid; grid-template-columns: repeat(7, 1fr);
  padding: 0 16px; margin-bottom: 5px;
}
.cal-dow span { text-align: center; font-size: 11px; color: var(--text2); font-weight: 500; padding: 3px 0; }

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; padding: 0 16px; }

.cal-cell {
  border-radius: 9px; padding: 5px 3px; min-height: 62px;
  border: 0.5px solid var(--border); cursor: pointer;
  transition: transform .1s; overflow: hidden;
}
.cal-cell:active { transform: scale(0.93); }
.cal-cell.empty { background: none; border-color: transparent; cursor: default; }
.cal-cell.empty:active { transform: none; }
.cc-day { font-size: 11px; font-weight: 700; margin-bottom: 2px; }
.cc-t { font-size: 8.5px; line-height: 1.35; }
.cal-cell.s-green { background: var(--green-bg); border-color: transparent; }
.cal-cell.s-green .cc-day { color: var(--green); }
.cal-cell.s-green .cc-t { color: var(--green); }
.cal-cell.s-orange { background: var(--orange-bg); border-color: transparent; }
.cal-cell.s-orange .cc-day { color: var(--orange); }
.cal-cell.s-orange .cc-t { color: var(--orange); }
.cal-cell.s-red { background: var(--red-bg); border-color: transparent; }
.cal-cell.s-red .cc-day { color: var(--red); }
.cal-cell.s-red .cc-t { color: var(--red); }
.cal-cell.s-gray { background: var(--gray-bg); border-color: transparent; }
.cal-cell.s-gray .cc-day { color: var(--gray); }
.cal-cell.s-gray .cc-t { color: var(--gray); }
.cal-cell.s-today { background: var(--blue-bg); border: 1.5px solid var(--blue-mid); }
.cal-cell.s-today .cc-day { color: var(--blue); }
.cal-cell.s-today .cc-t { color: var(--blue); }

.legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 12px 16px; }
.leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); }
.leg-dot { width: 7px; height: 7px; border-radius: 50%; }

.export-row { display: flex; gap: 10px; margin: 4px 16px 16px; }
.exp-btn {
  flex: 1; padding: 13px; border-radius: var(--radius-sm); font-size: 14px;
  font-weight: 500; font-family: var(--font); cursor: pointer;
  border: 0.5px solid var(--border); background: var(--bg2); color: var(--text);
  transition: opacity .15s;
}
.exp-btn:active { opacity: .6; }

/* ── HISTORY ── */
.hist-header { padding: 20px 16px 10px; }
.hist-header h2 { font-size: 22px; font-weight: 700; }

.month-filter { display: flex; gap: 8px; padding: 0 16px 14px; overflow-x: auto; scrollbar-width: none; }
.month-filter::-webkit-scrollbar { display: none; }
.mf-btn {
  flex-shrink: 0; padding: 6px 14px; border-radius: 20px; font-size: 13px;
  font-family: var(--font); cursor: pointer; white-space: nowrap;
  border: 0.5px solid var(--border); background: var(--bg); color: var(--text2);
}
.mf-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.hist-list { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
.hist-item {
  display: flex; align-items: center; gap: 13px;
  background: var(--bg2); border-radius: var(--radius-sm); padding: 14px 16px;
  border: 0.5px solid var(--border); cursor: pointer; transition: transform .1s;
}
.hist-item:active { transform: scale(0.98); }
.h-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.h-main { flex: 1; min-width: 0; }
.h-date { font-size: 14px; font-weight: 600; }
.h-times { font-size: 12px; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h-dur { font-size: 15px; font-weight: 700; flex-shrink: 0; }

/* ── MODAL ── */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.5); z-index: 200;
  align-items: flex-end; justify-content: center;
}
.overlay.open { display: flex; }
.modal {
  background: var(--bg); border-radius: 22px 22px 0 0; width: 100%; max-width: 500px;
  max-height: 92dvh; overflow-y: auto; padding-bottom: env(safe-area-inset-bottom);
  animation: up .22s ease;
}
@keyframes up { from { transform: translateY(30px); opacity:0; } to { transform: translateY(0); opacity:1; } }
.modal-handle { width: 38px; height: 4px; border-radius: 2px; background: var(--border); margin: 12px auto 0; }
.modal-header { padding: 16px 20px 14px; border-bottom: 0.5px solid var(--border); position: relative; }
.modal-title { font-size: 17px; font-weight: 700; }
.modal-sub { font-size: 13px; color: var(--text2); margin-top: 2px; }
.modal-close {
  position: absolute; top: 14px; right: 16px;
  background: var(--bg2); border: none; border-radius: 50%; width: 30px; height: 30px;
  font-size: 18px; cursor: pointer; color: var(--text2);
  display: flex; align-items: center; justify-content: center;
}
.modal-body { padding: 20px; }
.field { margin-bottom: 18px; }
.field label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 7px; font-weight: 500; }
.field input, .field textarea {
  width: 100%; padding: 13px 15px; border-radius: var(--radius-sm);
  border: 0.5px solid var(--border); font-size: 17px; font-family: var(--font);
  background: var(--bg); color: var(--text);
  -webkit-appearance: none;
}
.field textarea { height: 76px; resize: none; font-size: 15px; }
.computed {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--bg2); border-radius: var(--radius-sm); padding: 13px 15px; margin-bottom: 20px;
}
.computed span:first-child { font-size: 13px; color: var(--text2); }
.computed-dur { font-size: 20px; font-weight: 700; }
.save-btn {
  display: block; width: 100%; padding: 17px; background: var(--accent); color: #fff;
  border: none; border-radius: var(--radius-sm); font-size: 17px; font-weight: 700;
  font-family: var(--font); cursor: pointer; transition: opacity .15s, transform .1s;
}
.save-btn:active { transform: scale(0.98); opacity: .9; }

/* TOAST */
.toast {
  position: fixed; bottom: calc(84px + env(safe-area-inset-bottom));
  left: 50%; transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 11px 22px;
  border-radius: 22px; font-size: 14px; font-weight: 600;
  opacity: 0; transition: opacity .22s; z-index: 300; white-space: nowrap; pointer-events: none;
}
.toast.show { opacity: 1; }

.empty-state { text-align: center; padding: 48px 20px; color: var(--text2); font-size: 14px; }
</style>
</head>
<body>

<nav>
  <button class="active" onclick="tab('home')">Aujourd'hui</button>
  <button onclick="tab('calendar')">Calendrier</button>
  <button onclick="tab('history')">Historique</button>
</nav>

<!-- HOME -->
<div id="tab-home" class="section active">
  <div class="home-header">
    <div class="sub">MAM · Les Crocs Mignons</div>
    <div class="title">PAUL</div>
    <div class="dateline" id="dateline"></div>
  </div>

  <div class="card">
    <div class="today-row">
      <div>
        <div class="lbl">Arrivée</div>
        <div class="val" id="arr-val">—</div>
      </div>
      <div style="text-align:right">
        <div class="lbl">Départ</div>
        <div class="val" id="dep-val">—</div>
      </div>
    </div>
    <hr class="divider">
    <div class="dur-row">
      <span>Durée du jour</span>
      <span class="dur-val" id="dur-val">—</span>
    </div>
  </div>

  <button class="main-btn arrive" id="main-btn" onclick="mainBtnClick()">Arrivée à la MAM</button>

  <div class="card">
    <div class="week-title">Cette semaine</div>
    <div class="week-days" id="week-days"></div>
    <div class="week-total-row">
      <span>Total semaine</span>
      <span class="week-total-val" id="week-total">—</span>
    </div>
  </div>

  <div class="sync-bar">
    <div class="sync-dot" id="sdot"></div>
    <span id="slabel">Connexion…</span>
  </div>
</div>

<!-- CALENDAR -->
<div id="tab-calendar" class="section">
  <div class="cal-header">
    <span class="cal-month-title" id="cal-title"></span>
    <div class="cal-nav">
      <button onclick="prevM()">‹</button>
      <button onclick="nextM()">›</button>
    </div>
  </div>
  <div class="cal-stats">
    <div class="cs"><div class="cs-lbl">Total mois</div><div class="cs-val" id="m-total">—</div></div>
    <div class="cs"><div class="cs-lbl">Jours complets</div><div class="cs-val" id="m-complete">—</div></div>
  </div>
  <div class="cal-dow">
    <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
  <div class="legend">
    <div class="leg"><div class="leg-dot" style="background:var(--green-mid)"></div>Complet</div>
    <div class="leg"><div class="leg-dot" style="background:var(--orange-mid)"></div>Dépassement (&gt;9h)</div>
    <div class="leg"><div class="leg-dot" style="background:var(--red-mid)"></div>Incomplet</div>
    <div class="leg"><div class="leg-dot" style="background:var(--gray-mid)"></div>En attente</div>
  </div>
  <div class="export-row">
    <button class="exp-btn" onclick="exportCSV()">⬇ Export CSV</button>
    <button class="exp-btn" onclick="exportPrint()">🖨 Imprimer</button>
  </div>
</div>

<!-- HISTORY -->
<div id="tab-history" class="section">
  <div class="hist-header"><h2>Historique</h2></div>
  <div class="month-filter" id="mfilter"></div>
  <div class="hist-list" id="hist-list"></div>
  <div style="height:16px"></div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="modal-title">—</div>
      <div class="modal-sub">PAUL · Les Crocs Mignons</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Heure d'arrivée</label>
        <input type="time" id="m-arr" onchange="calcModal()">
      </div>
      <div class="field">
        <label>Heure de départ</label>
        <input type="time" id="m-dep" onchange="calcModal()">
      </div>
      <div class="computed">
        <span>Durée calculée</span>
        <span class="computed-dur" id="m-dur">—</span>
      </div>
      <div class="field">
        <label>Note</label>
        <textarea id="m-note" placeholder="Remarque, activité…"></textarea>
      </div>
      <button class="save-btn" onclick="saveModal()">Enregistrer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── CONFIG SUPABASE ───────────────────────────────────────────
const SB_URL = 'https://vihqikkyvuwsruymrjxb.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpaHFpa2t5dnV3c3J1eW1yanhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMDUwODgsImV4cCI6MjA5NDY4MTA4OH0.-jPzopYNLKdht7eJsxUIJHXOEyH9du73dxuZDsGBN9o';
const HDR = {
  'Content-Type': 'application/json',
  'apikey': SB_KEY,
  'Authorization': 'Bearer ' + SB_KEY,
  'Prefer': 'resolution=merge-duplicates,return=minimal'
};

// ─── ÉTAT LOCAL ────────────────────────────────────────────────
let DB = JSON.parse(localStorage.getItem('mam_v3') || '{}');
let calY, calM, modalDate = null, histMonth = null, ws = null;

const NOW  = new Date();
const TODAY = d2s(NOW);

// ─── UTILITAIRES ──────────────────────────────────────────────
function d2s(d) { return d.toISOString().slice(0, 10); }
function hhmm(d) { return d.toTimeString().slice(0, 5); }
function minsToH(m) {
  if (m == null) return '—';
  const h = Math.floor(m / 60), mn = m % 60;
  return mn === 0 ? h + 'h' : h + 'h' + String(mn).padStart(2, '0');
}
function dur(r) {
  if (!r || !r.a || !r.d) return null;
  const [ah, am] = r.a.split(':').map(Number);
  const [dh, dm] = r.d.split(':').map(Number);
  return (dh * 60 + dm) - (ah * 60 + am);
}
function status(r, ds) {
  if (!r || (!r.a && !r.d)) return ds < TODAY ? 'red' : 'gray';
  if (r.a && !r.d)          return ds < TODAY ? 'red' : 'gray';
  const d = dur(r);
  return d > 540 ? 'orange' : 'green';
}
function saveLocal() { localStorage.setItem('mam_v3', JSON.stringify(DB)); }

// ─── SYNC STATUS ──────────────────────────────────────────────
function setSyncStatus(state) {
  const dot = document.getElementById('sdot');
  const lbl = document.getElementById('slabel');
  const map = { ok: ['', 'Synchronisé · ' + hhmm(new Date())], syncing: ['syncing', 'Synchronisation…'], offline: ['offline', 'Hors ligne · données locales'], rt: ['', '🟢 Temps réel actif'] };
  const [cls, text] = map[state] || ['', state];
  dot.className = 'sync-dot ' + cls;
  lbl.textContent = text;
}

// ─── SUPABASE REST ────────────────────────────────────────────
async function sbLoad() {
  setSyncStatus('syncing');
  try {
    const res = await fetch(SB_URL + '/rest/v1/attendance_records?select=date,arrival_time,departure_time,notes&order=date.desc', { headers: HDR });
    if (!res.ok) throw new Error(res.status);
    const rows = await res.json();
    rows.forEach(row => {
      DB[row.date] = {
        a: row.arrival_time   ? row.arrival_time.slice(0, 5)   : null,
        d: row.departure_time ? row.departure_time.slice(0, 5) : null,
        n: row.notes || ''
      };
    });
    saveLocal();
    setSyncStatus('ok');
    renderAll();
    sbRealtime();
  } catch (e) {
    setSyncStatus('offline');
    renderAll();
  }
}

async function sbUpsert(ds) {
  setSyncStatus('syncing');
  const r = DB[ds] || {};
  try {
    await fetch(SB_URL + '/rest/v1/attendance_records', {
      method: 'POST', headers: HDR,
      body: JSON.stringify({
        date: ds,
        arrival_time:   r.a || null,
        departure_time: r.d || null,
        notes:          r.n || null,
        updated_at: new Date().toISOString()
      })
    });
    setSyncStatus('ok');
  } catch (e) { setSyncStatus('offline'); }
}

// ─── REALTIME WEBSOCKET ───────────────────────────────────────
function sbRealtime() {
  if (ws) return;
  try {
    ws = new WebSocket(SB_URL.replace('https://', 'wss://') + '/realtime/v1/websocket?apikey=' + SB_KEY + '&vsn=1.0.0');
    ws.onopen = () => {
      ws.send(JSON.stringify({ topic: 'realtime:public:attendance_records', event: 'phx_join', payload: {}, ref: '1' }));
      setSyncStatus('rt');
    };
    ws.onmessage = e => {
      const msg = JSON.parse(e.data);
      if (msg.event === 'INSERT' || msg.event === 'UPDATE') {
        const row = msg.payload?.record;
        if (row?.date) {
          DB[row.date] = {
            a: row.arrival_time   ? row.arrival_time.slice(0, 5)   : null,
            d: row.departure_time ? row.departure_time.slice(0, 5) : null,
            n: row.notes || ''
          };
          saveLocal();
          renderAll();
          if (row.date === TODAY) toast('🔄 Mis à jour par l\'autre parent');
        }
      }
    };
    ws.onclose = () => { ws = null; setSyncStatus('offline'); setTimeout(sbRealtime, 5000); };
  } catch (e) { setSyncStatus('offline'); }
}

// ─── RENDER ALL ───────────────────────────────────────────────
function renderAll() {
  renderHome();
  if (document.getElementById('tab-calendar').classList.contains('active')) renderCalendar();
  if (document.getElementById('tab-history').classList.contains('active'))  renderHistory();
}

// ─── HOME ─────────────────────────────────────────────────────
function updateClock() {
  const n = new Date();
  const dn = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const mn = ['jan.','fév.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  const el = document.getElementById('dateline');
  if (el) el.innerHTML = dn[n.getDay()] + ' ' + n.getDate() + ' ' + mn[n.getMonth()] + ' &nbsp;·&nbsp; <strong>' + hhmm(n) + '</strong>';
}

function renderHome() {
  const r = DB[TODAY] || {};
  const av = document.getElementById('arr-val');
  const dv = document.getElementById('dep-val');
  const dv2 = document.getElementById('dur-val');
  const btn = document.getElementById('main-btn');

  av.textContent = r.a || '—';
  av.className = 'val' + (r.a ? '' : ' muted');
  dv.textContent = r.d || '—';
  dv.className = 'val' + (r.d ? '' : ' muted');
  dv2.textContent = minsToH(dur(r));

  if (!r.a) {
    btn.textContent = 'Arrivée à la MAM'; btn.className = 'main-btn arrive'; btn.disabled = false;
  } else if (!r.d) {
    btn.textContent = 'Départ de la MAM'; btn.className = 'main-btn depart'; btn.disabled = false;
  } else {
    btn.textContent = '✓ Journée complète'; btn.className = 'main-btn done'; btn.disabled = true;
  }
  renderWeek();
}

function renderWeek() {
  const names = ['L','M','M','J','V','S','D'];
  const colors = { green: '#639922', orange: '#BA7517', red: '#E24B4A', gray: '#B4B2A9' };
  const wd = document.getElementById('week-days');
  wd.innerHTML = '';
  const base = new Date(NOW);
  base.setDate(base.getDate() - (base.getDay() + 6) % 7);
  let total = 0;
  for (let i = 0; i < 7; i++) {
    const ds = d2s(base);
    const r = DB[ds] || {};
    const d = dur(r);
    const st = status(r, ds);
    if (d) total += d;
    const div = document.createElement('div');
    div.className = 'wd' + (ds === TODAY ? ' today-col' : '');
    div.innerHTML = '<div class="wd-name">' + names[i] + '</div>'
      + '<div class="wd-dot" style="background:' + colors[st] + '"></div>'
      + '<div class="wd-dur" style="color:' + colors[st] + '">' + (d ? minsToH(d) : '·') + '</div>';
    wd.appendChild(div);
    base.setDate(base.getDate() + 1);
  }
  document.getElementById('week-total').textContent = total ? minsToH(total) : '—';
}

function mainBtnClick() {
  const r = DB[TODAY] || {};
  const now = hhmm(new Date());
  if (!r.a)       { DB[TODAY] = { ...r, a: now }; toast('Arrivée enregistrée · ' + now); }
  else if (!r.d)  { DB[TODAY] = { ...r, d: now }; toast('Départ enregistré · ' + now); }
  saveLocal(); sbUpsert(TODAY); renderHome();
}

// ─── CALENDAR ─────────────────────────────────────────────────
const MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

function renderCalendar() {
  document.getElementById('cal-title').textContent = MONTHS[calM] + ' ' + calY;
  const last = new Date(calY, calM + 1, 0).getDate();
  const startDow = (new Date(calY, calM, 1).getDay() + 6) % 7;
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  let mTotal = 0, mComplete = 0;

  for (let i = 0; i < startDow; i++) {
    const e = document.createElement('div'); e.className = 'cal-cell empty'; grid.appendChild(e);
  }
  for (let day = 1; day <= last; day++) {
    const ds = calY + '-' + String(calM + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
    const r = DB[ds] || {};
    const d = dur(r);
    const st = status(r, ds);
    if (d) mTotal += d;
    if (st === 'green' || st === 'orange') mComplete++;
    const cell = document.createElement('div');
    const isToday = ds === TODAY;
    cell.className = 'cal-cell ' + (isToday ? 's-today' : 's-' + st);
    cell.onclick = () => openModal(ds);
    let info = '';
    if (r.a) info += '<div class="cc-t">' + r.a + '</div>';
    if (r.d) info += '<div class="cc-t">' + r.d + '</div>';
    if (d)   info += '<div class="cc-t" style="font-weight:700">' + minsToH(d) + '</div>';
    cell.innerHTML = '<div class="cc-day">' + day + '</div>' + info;
    grid.appendChild(cell);
  }
  document.getElementById('m-total').textContent = mTotal ? minsToH(mTotal) : '0h';
  document.getElementById('m-complete').textContent = mComplete;
}

function prevM() { calM--; if (calM < 0) { calM = 11; calY--; } renderCalendar(); }
function nextM() { calM++; if (calM > 11) { calM = 0;  calY++; } renderCalendar(); }

// ─── HISTORY ──────────────────────────────────────────────────
const MSHORT = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
const DSHORT = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const STCOLOR = { green: '#639922', orange: '#BA7517', red: '#E24B4A', gray: '#B4B2A9' };

function renderHistory() {
  const allDates = Object.keys(DB).sort().reverse();
  const months = [...new Set(allDates.map(d => d.slice(0, 7)))];

  const mf = document.getElementById('mfilter');
  mf.innerHTML = '';
  months.forEach(m => {
    const [y, mo] = m.split('-');
    const btn = document.createElement('button');
    btn.className = 'mf-btn' + (histMonth === m ? ' active' : '');
    btn.textContent = MSHORT[parseInt(mo) - 1] + ' ' + y;
    btn.onclick = () => { histMonth = histMonth === m ? null : m; renderHistory(); };
    mf.appendChild(btn);
  });

  const list = document.getElementById('hist-list');
  list.innerHTML = '';
  const filtered = histMonth ? allDates.filter(d => d.startsWith(histMonth)) : allDates;

  filtered.forEach(ds => {
    const r = DB[ds];
    if (!r || (!r.a && !r.d && !r.n)) return;
    const d = new Date(ds + 'T12:00:00');
    const st = status(r, ds);
    const dv = dur(r);
    const item = document.createElement('div');
    item.className = 'hist-item';
    item.onclick = () => openModal(ds);
    item.innerHTML = '<div class="h-dot" style="background:' + STCOLOR[st] + '"></div>'
      + '<div class="h-main"><div class="h-date">' + DSHORT[d.getDay()] + ' ' + d.getDate() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear() + '</div>'
      + '<div class="h-times">' + (r.a || '?') + ' → ' + (r.d || '?') + (r.n ? ' · ' + r.n : '') + '</div></div>'
      + '<div class="h-dur" style="color:' + STCOLOR[st] + '">' + (dv ? minsToH(dv) : '—') + '</div>';
    list.appendChild(item);
  });

  if (!list.children.length) list.innerHTML = '<div class="empty-state">Aucune donnée</div>';
}

// ─── MODAL ────────────────────────────────────────────────────
function openModal(ds) {
  modalDate = ds;
  const r = DB[ds] || {};
  const d = new Date(ds + 'T12:00:00');
  const mn = ['jan.','fév.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  document.getElementById('modal-title').textContent = DSHORT[d.getDay()] + ' ' + d.getDate() + ' ' + mn[d.getMonth()] + ' ' + d.getFullYear();
  document.getElementById('m-arr').value  = r.a || '';
  document.getElementById('m-dep').value  = r.d || '';
  document.getElementById('m-note').value = r.n || '';
  calcModal();
  document.getElementById('overlay').classList.add('open');
}

function calcModal() {
  const a = document.getElementById('m-arr').value;
  const d = document.getElementById('m-dep').value;
  if (a && d) {
    const [ah, am] = a.split(':').map(Number);
    const [dh, dm] = d.split(':').map(Number);
    const mins = (dh * 60 + dm) - (ah * 60 + am);
    document.getElementById('m-dur').textContent = mins > 0 ? minsToH(mins) : '—';
  } else {
    document.getElementById('m-dur').textContent = '—';
  }
}

function saveModal() {
  DB[modalDate] = {
    a: document.getElementById('m-arr').value  || null,
    d: document.getElementById('m-dep').value  || null,
    n: document.getElementById('m-note').value || ''
  };
  saveLocal(); sbUpsert(modalDate); closeModal(); renderAll(); toast('Enregistré ✓');
}

function overlayClick(e) { if (e.target.id === 'overlay') closeModal(); }
function closeModal() { document.getElementById('overlay').classList.remove('open'); }

// ─── TABS ─────────────────────────────────────────────────────
function tab(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach((b, i) => {
    b.classList.toggle('active', ['home','calendar','history'][i] === name);
  });
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'calendar') renderCalendar();
  if (name === 'history')  renderHistory();
}

// ─── TOAST ────────────────────────────────────────────────────
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

// ─── EXPORT CSV ───────────────────────────────────────────────
function exportCSV() {
  const stLabel = { green:'Complet', orange:'Dépassement', red:'Incomplet', gray:'En attente' };
  let csv = 'Date,Arrivée,Départ,Durée,Statut,Notes\n';
  const last = new Date(calY, calM + 1, 0).getDate();
  for (let day = 1; day <= last; day++) {
    const ds = calY + '-' + String(calM + 1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    const r = DB[ds] || {};
    const d = dur(r);
    csv += [ds, r.a||'', r.d||'', d ? minsToH(d) : '', stLabel[status(r,ds)], r.n||''].join(',') + '\n';
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'PAUL_MAM_' + calY + '-' + String(calM + 1).padStart(2,'0') + '.csv';
  a.click();
  toast('CSV exporté ✓');
}

// ─── EXPORT PRINT ─────────────────────────────────────────────
function exportPrint() {
  const stLabel = { green:'Complet', orange:'Dépassement', red:'Incomplet', gray:'—' };
  const stColor = { green:'#3B6D11', orange:'#854F0B', red:'#A32D2D', gray:'#888780' };
  const last = new Date(calY, calM + 1, 0).getDate();
  let rows = '', total = 0;
  for (let day = 1; day <= last; day++) {
    const ds = calY + '-' + String(calM + 1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    const r = DB[ds] || {};
    const d = dur(r);
    const st = status(r, ds);
    const date = new Date(ds + 'T12:00:00');
    if (d) total += d;
    rows += '<tr><td>' + DSHORT[date.getDay()] + ' ' + day + '</td>'
      + '<td>' + (r.a||'—') + '</td><td>' + (r.d||'—') + '</td>'
      + '<td>' + (d ? minsToH(d) : '—') + '</td>'
      + '<td style="color:' + stColor[st] + ';font-weight:600">' + stLabel[st] + '</td>'
      + '<td>' + (r.n||'') + '</td></tr>';
  }
  const win = window.open('', '_blank');
  win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>PAUL · MAM · ' + MONTHS[calM] + ' ' + calY + '</title>'
    + '<style>body{font-family:sans-serif;padding:24px;color:#1a1a1a}h1{font-size:18px;margin-bottom:18px}'
    + 'table{width:100%;border-collapse:collapse;font-size:13px}'
    + 'th,td{border:1px solid #ddd;padding:7px 9px;text-align:left}'
    + 'th{background:#f5f5f3;font-weight:600}tfoot td{font-weight:700;background:#f0f0ee}</style>'
    + '</head><body>'
    + '<h1>PAUL · Les Crocs Mignons · ' + MONTHS[calM] + ' ' + calY + '</h1>'
    + '<table><thead><tr><th>Jour</th><th>Arrivée</th><th>Départ</th><th>Durée</th><th>Statut</th><th>Note</th></tr></thead>'
    + '<tbody>' + rows + '</tbody>'
    + '<tfoot><tr><td colspan="3"><strong>Total mensuel</strong></td><td><strong>' + minsToH(total) + '</strong></td><td colspan="2"></td></tr></tfoot>'
    + '</table></body></html>');
  win.print();
}

// ─── INIT ─────────────────────────────────────────────────────
function init() {
  calY = NOW.getFullYear();
  calM = NOW.getMonth();
  updateClock();
  setInterval(updateClock, 20000);
  renderHome();
  sbLoad();
}

init();
</script>
</body>
